<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base de Conhecimento — Ciclismo (app)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --paper:#F3F3EF; --card:#FFFFFF; --ink:#17191E; --muted:#6A6E77;
    --line:#E4E3DD; --line-strong:#D3D2CA; --signal:#D8452F;
    --d-fisiologia:#6E8F3F; --d-limiares:#3F9E96; --d-metricas:#3E6B8C;
    --d-metodologia:#8A6DB0; --d-tipos:#C46A2B; --d-avaliacao:#55809E;
    --d-nutricao:#B08A2E; --d-recuperacao:#C24D57; --d-contexto:#7A7E86;
    --d-templates:#A6ACB4;
    --r:14px;
    --serif: "Space Grotesk", system-ui, sans-serif;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "Space Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  .rail{background:var(--card);border-right:1px solid var(--line);
    padding:26px 22px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.02em;line-height:1.15}
  .brand .k{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;
    letter-spacing:.16em;text-transform:uppercase;color:var(--signal);margin-bottom:7px}
  .search{width:100%;border:1px solid var(--line-strong);background:var(--paper);
    border-radius:10px;padding:9px 11px;font-family:var(--sans);font-size:13.5px;color:var(--ink)}
  .search:focus{outline:2px solid var(--ink);outline-offset:1px}
  .navlink{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
    font-family:var(--serif);font-weight:600;font-size:14px;color:var(--ink);padding:7px 8px;border-radius:8px}
  .navlink:hover{background:var(--paper)}
  .navlink.active{background:var(--ink);color:#fff}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--muted);margin:2px 0 4px}
  .doms{display:flex;flex-direction:column;gap:1px}
  .dom{display:flex;align-items:center;gap:9px;border:0;background:none;cursor:pointer;
    text-align:left;padding:6px 8px;border-radius:8px;font-size:13px;color:var(--ink);width:100%}
  .dom:hover{background:var(--paper)}
  .dom .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .dom .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dom .ct{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .dom[data-empty="1"]{opacity:.42}
  .foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:16px}
  .main{padding:0}
  .wrap{padding:34px 40px 70px;max-width:1080px}
  .h-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--signal)}
  h1{font-family:var(--serif);font-weight:700;font-size:34px;letter-spacing:-.025em;line-height:1.08;margin:10px 0 12px}
  .lede{font-size:16px;color:#33363D;max-width:64ch;margin:0 0 6px}
  .hint{font-size:13.5px;color:var(--muted);max-width:64ch}
  .graphcard{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .graphhead{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .graphhead .t{font-family:var(--serif);font-weight:600;font-size:15px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .lg-line{width:22px;height:0;border-top:2px solid var(--line-strong)}
  .lg-line.pre{border-top-style:solid;border-color:#9A9E29A6}
  .lg-line.cau{border-top:2px solid var(--signal)}
  .lg-line.com{border-top:2px dashed var(--line-strong)}
  .lg-line.con{border-top:2px solid #B23A55}
  .lg-line.alt{border-top:2px dotted #8A6DB0}
  .graphwrap{position:relative;background:
    radial-gradient(circle at 1px 1px, #E7E6E0 1px, transparent 0) 0 0/22px 22px}
  svg.graph{display:block;width:100%;height:640px;cursor:grab}
  svg.graph.panning{cursor:grabbing}
  .edge{stroke:#B9BDB0;stroke-width:1.2;fill:none;transition:stroke-opacity .2s}
  .edge.cau{stroke:var(--signal)}
  .edge.com{stroke-dasharray:5 5}
  .edge.con{stroke:#B23A55;stroke-width:1.6}
  .edge.alt{stroke:#8A6DB0;stroke-dasharray:2 4}
  .gnode{cursor:pointer}
  .gnode circle,.gnode rect{transition:transform .15s;transform-origin:center}
  .gnode:hover circle,.gnode:focus circle,.gnode:hover rect,.gnode:focus rect{stroke:var(--ink);stroke-width:2.4px}
  .edge.spre{stroke:var(--d-metricas)}
  .edge.scons{stroke:var(--signal);stroke-dasharray:5 5}
  .edge.scomp{stroke:var(--line-strong);stroke-dasharray:2 4}
  .edge.sdesp{stroke:var(--d-metodologia);stroke-width:1.8}
  .lg-line.spre{border-top:2px solid var(--d-metricas)}
  .lg-line.scons{border-top:2px dashed var(--signal)}
  .lg-line.scomp{border-top:2px dotted var(--line-strong)}
  .lg-line.sdesp{border-top:2px solid var(--d-metodologia)}
  .gnode text.tag{font-family:var(--mono);font-size:8.5px;fill:#fff;font-weight:700;text-anchor:middle;pointer-events:none}
  .dim .edge{stroke-opacity:.08}
  .dim .gnode{opacity:.2}
  .gnode.hot,.gnode.nb{opacity:1}
  .edge.hot{stroke-opacity:1;stroke-width:2.2}
  .graphctl{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
  .gbtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);
    cursor:pointer;font-family:var(--mono);font-size:14px;color:var(--ink)}
  .gbtn:hover{background:var(--paper)}
  .back{border:0;background:none;cursor:pointer;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.06em;color:var(--muted);padding:0;margin-bottom:18px;display:inline-flex;gap:7px;align-items:center}
  .back:hover{color:var(--ink)}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .tag-id{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff;letter-spacing:.01em}
  .chip.line{background:none;border:1px solid var(--line-strong);color:var(--muted);font-weight:500}
  .chip.type{background:#25272E}
  h2.note{font-family:var(--serif);font-weight:700;font-size:25px;letter-spacing:-.02em;line-height:1.18;margin:0 0 18px;max-width:44ch}
  .body{font-size:15.5px;color:#26282E;max-width:66ch}
  .body p{margin:0 0 14px}
  .body ul{margin:0 0 14px;padding-left:22px}
  .body li{margin-bottom:6px}
  .body table{border-collapse:collapse;margin:6px 0 16px;font-size:14px;width:100%;max-width:620px}
  .body.wide{max-width:none}
  .body.wide table{max-width:100%}
  .body th,.body td{border:1px solid var(--line-strong);padding:7px 11px;text-align:left}
  .body th{background:var(--paper);font-weight:600;font-family:var(--serif)}
  .apply{background:#F6F4EC;border-left:3px solid var(--d-tipos);border-radius:0 8px 8px 0;
    padding:12px 16px;margin:18px 0;font-size:14.5px;max-width:66ch}
  .apply .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9a7b2e;display:block;margin-bottom:4px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .panel h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px;font-weight:400}
  .src{font-size:13.5px;margin-bottom:14px}
  .src .bk{font-weight:600;font-family:var(--serif)}
  .src .pg{font-family:var(--mono);color:var(--muted);font-size:12px}
  .src .q{margin-top:8px;padding-left:11px;border-left:2px solid var(--line-strong);
    color:var(--muted);font-style:italic;font-size:13px}
  .rel{display:flex;flex-direction:column;gap:8px}
  .relitem{border:0;background:none;text-align:left;cursor:pointer;padding:8px 10px;border-radius:9px;
    display:flex;flex-direction:column;gap:3px;width:100%}
  .relitem:hover{background:var(--paper)}
  .relitem .rrow{display:flex;gap:10px;align-items:baseline}
  .relitem .rt{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 6px;border-radius:5px;background:var(--paper);color:var(--muted);flex:none;border:1px solid var(--line)}
  .relitem .rt.causal{color:var(--signal);border-color:#e7b8b0}
  .relitem .rt.contradiz{color:#B23A55;border-color:#e7b0bd}
  .relitem .rt.alternativa-a{color:#8A6DB0;border-color:#d6c9ea}
  .relitem .rx{font-size:13.5px}
  .relitem .rx b{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-right:6px}
  .relitem .rj{font-size:12px;color:var(--muted);font-style:italic;padding-left:2px}
  .sinais{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .sig{font-family:var(--mono);font-size:10.5px;background:var(--paper);border:1px solid var(--line);
    padding:3px 7px;border-radius:6px;color:#4a4d54}
  .listhead{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:2px 0 4px;display:flex;align-items:center;gap:11px}
  .listhead .dot{width:13px;height:13px;border-radius:4px}
  .listsub{color:var(--muted);font-size:13.5px;margin-bottom:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .ncard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;
    padding:15px 16px;cursor:pointer;display:flex;flex-direction:column;gap:9px}
  .ncard:hover{border-color:var(--line-strong);box-shadow:0 3px 14px rgba(20,20,20,.05)}
  .ncard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ncard .cid{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ncard .tt{font-family:var(--serif);font-weight:600;font-size:14.5px;line-height:1.25}
  .ncard .mt{display:flex;gap:7px;align-items:center;margin-top:auto}
  .ncard .mini{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;color:var(--ink)}
  .ncard .miniline{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
  .empty{color:var(--muted);font-size:14px;padding:30px 0}
  .revsection{margin-top:30px}
  .revhead{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.01em}
  .revdot{width:11px;height:11px;border-radius:50%;flex:none}
  .revdot.baixa-confianca{background:#C9A227}
  .revdot.conflito{background:#B23A55}
  .revdot.modelo-concorrente{background:#8A6DB0}
  .revcount{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
  .revlist{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .revcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .revtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .revnotas{display:flex;gap:6px;flex-wrap:wrap}
  .relitem-mini{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);background:var(--paper);
    color:var(--ink);border-radius:20px;padding:2px 9px;cursor:pointer}
  .relitem-mini:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .revtitle{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.3;margin-bottom:8px}
  .revbody{font-size:14px;color:#33363D}
  .revbody p{margin:0 0 10px}
  .revflag{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FBF3DD;border:1px solid #E8D9A6;
    border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:13.5px;color:#6b5511}
  .revflag button{font-family:var(--mono);font-size:11.5px;border:0;background:none;cursor:pointer;color:#6b5511;text-decoration:underline;padding:0}
  @media(max-width:720px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.wrap{padding:26px 20px 60px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  .body h3{font-family:var(--serif);font-weight:700;font-size:18px;margin:22px 0 8px;max-width:66ch}
  .body h4{font-family:var(--serif);font-weight:600;font-size:15px;margin:16px 0 6px;max-width:66ch}
  .body pre{background:#1E2027;color:#E7E6E1;border-radius:10px;padding:13px 15px;overflow-x:auto;
    font-family:var(--mono);font-size:12px;line-height:1.5;margin:0 0 14px;max-width:66ch}
  .body pre code{background:none;padding:0;color:inherit}
  .body code{background:#EDEBE2;border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:13px}
  .skillbadge{background:#F1EDF7;border-left:3px solid var(--d-metodologia);border-radius:0 8px 8px 0;
    padding:12px 16px;margin:16px 0;font-size:14px;max-width:66ch;color:#2c2438}
  .skillbadge.fb{background:#EAF1F5;border-left-color:var(--d-avaliacao)}
  .skillbadge .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:#5b4a86;display:block;margin-bottom:4px}
  .skillbadge.fb .k{color:#2f5a72}
  .dnlist{display:flex;flex-direction:column;gap:10px}
  .dnrow{border:1px solid var(--line);border-radius:10px;padding:10px 13px}
  .dnrow .dnhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .dncampo{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600}
  .dntag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;color:#fff;font-weight:700}
  .dntag.bruto{background:var(--d-metricas)}
  .dntag.calculado{background:var(--d-fisiologia)}
  .dntag.estimado{background:var(--d-tipos)}
  .dntag.manual{background:var(--d-metodologia)}
  .dnreq{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .dnfonte{font-size:13px;color:#33363D;margin-top:5px}
  .dnobs{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:4px}
  .idlink{color:var(--signal);text-decoration:none;border-bottom:1px dotted var(--signal);
    cursor:pointer;font-weight:600}
  .idlink:hover{background:#FBEAE6}

  /* ---- adições do app interativo (upload / status / revisão / login) — mesma linguagem visual ---- */
  .authbox{display:flex;flex-direction:column;gap:8px}
  .authstatus{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .authdot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
  .authdot.on{background:#3F9E96}
  .authbtn{width:100%;border:1px solid var(--line-strong);background:var(--paper);border-radius:10px;
    padding:8px 11px;font-family:var(--serif);font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
  .authbtn:hover{background:#EAE9E2}
  .loginform{display:flex;flex-direction:column;gap:12px;max-width:340px}
  .loginform input{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;
    padding:10px 12px;font-family:var(--sans);font-size:14px;color:var(--ink)}
  .loginform input:focus{outline:2px solid var(--ink);outline-offset:1px}
  .btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:9px 16px;
    font-family:var(--serif);font-weight:600;font-size:13.5px;cursor:pointer}
  .btn:hover{opacity:.88}
  .btn.ghost{background:none;color:var(--ink)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .formmsg{font-size:13px;color:var(--muted)}
  .formmsg.err{color:var(--signal)}
  .formmsg.ok{color:#3F9E96}
  .dropzone{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:34px 20px;text-align:center;
    background:var(--card);cursor:pointer;max-width:520px}
  .dropzone.over{border-color:var(--signal);background:#FBEAE6}
  .dropzone .dz-t{font-family:var(--serif);font-weight:600;font-size:15px;margin-bottom:6px}
  .dropzone .dz-s{font-size:12.5px;color:var(--muted)}
  .jobtable{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .jobrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .jobname{font-family:var(--serif);font-weight:600;font-size:14px}
  .jobmeta{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .jobstatus{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 10px;border-radius:20px;color:#fff;font-weight:700;flex:none}
  .jobstatus.pendente{background:var(--muted)}
  .jobstatus.processando{background:var(--d-avaliacao)}
  .jobstatus.aguardando_revisao{background:#C9A227}
  .jobstatus.concluido{background:#3F9E96}
  .jobstatus.erro{background:var(--signal)}
  .decisionrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .commentlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .commentitem{background:var(--paper);border-radius:9px;padding:8px 11px;font-size:13px}
  .commentitem .ca{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block;margin-bottom:2px}
  .lockmsg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;
    max-width:440px;font-size:14px;color:#33363D}

  /* ---- Área do atleta: dashboard diário/semanal/mensal (portado do mockup, escopo isolado
     em .dashwrap pra não vazar estilo pro resto do app — layout ainda com dado estático) ---- */
  .dashwrap{
    --sub:#5f5e5a; --bg:#fdfcfa;
    --green-bg:#EAF3DE; --green-tx:#173404; --green-tx2:#27500A;
    --amber-bg:#FAEEDA; --amber-tx:#412402; --amber-tx2:#633806;
    --blue:#185FA5; --red:#d03b3b; --gray:#c3c2b7;
    background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.6; max-width:760px; margin:18px 0 0; padding:20px 20px 40px;
    border-radius:16px; border:1px solid var(--line);
  }
  .dashwrap h1{font-size:21px;font-weight:600;margin:0 0 2px}
  .dashwrap .sub{color:var(--sub);font-size:14px;margin:0 0 18px}
  .dashwrap h2{font-size:16px;font-weight:600;margin:0 0 12px}
  .dashwrap section{margin-bottom:34px}
  .dashwrap .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 0;margin:-20px -20px 16px;border-radius:16px 16px 0 0}
  .dashwrap .topbar-inner{padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .dashwrap .modebar{display:flex;gap:6px}
  .dashwrap .modebtn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;color:var(--sub)}
  .dashwrap .modebtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

<script>
const skillById = {};
const NOTA_TO_SKILLS = {};
function reindexSkills(){
  Object.keys(skillById).forEach(k=>delete skillById[k]);
  SKILLS.forEach(s=>skillById[s.id]=s);

  }));
}
function skillsUsingNota(id){ return NOTA_TO_SKILLS[id] || []; }
function skillIncomingRel(id){
  return SKILLS.filter(s => (s.skillsRel||[]).some(r=>r.id===id))
    .map(s => ({from: s.id, tipo: (s.skillsRel.find(r=>r.id===id)||{}).tipo}));
}

let EDGES = [], byId = {};
function reindexNotes(){
  EDGES = [];
  NOTES.forEach(n => (n.rel||[]).forEach(r => EDGES.push({from:n.id, to:r.id, tipo:r.tipo, just:r.justificativa})));
  byId = Object.fromEntries(NOTES.map(n=>[n.id,n]));
}
function incoming(id){ return EDGES.filter(e=>e.to===id).map(e=>({from:e.from,tipo:e.tipo,just:e.just})); }

/* ---------------- Auto-link de nota-XXXX / skill-... mencionados dentro de texto livre ---------------- */
let SKILL_ID_RE = null;
function reindexLinkify(){
  const SKILL_ID_SORTED = SKILLS.map(s=>s.id).sort((a,b)=>b.length-a.length);
  SKILL_ID_RE = SKILL_ID_SORTED.length
    ? new RegExp('(' + SKILL_ID_SORTED.map(id=>id.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')', 'g')
    : null;
}
const NOTA_ID_RE = /nota-\d{4}/g;
function linkifyIds(html){
  html = html.replace(NOTA_ID_RE, m => byId[m] ? `<a href="javascript:void(0)" class="idlink" onclick="go({v:'note',id:'${m}'})">${m}</a>` : m);
  if(SKILL_ID_RE) html = html.replace(SKILL_ID_RE, m => skillById[m] ? `<a href="javascript:void(0)" class="idlink" onclick="go({v:'skill',id:'${m}'})">${m}</a>` : m);
  return html;
}

const TIPO = {
  "regra-interpretacao":"Regra de interpretação",
  "conceito":"Conceito","protocolo":"Protocolo","referencia":"Referência"
};

function domColor(d){ return DOMS[d]?DOMS[d].c:'#999'; }
function shortDom(d){ return DOMS[d]?DOMS[d].nm:d; }
function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineMd(s){ s=escapeHtml(s); s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); s=s.replace(/`([^`]+)`/g,'<code>$1</code>'); s=linkifyIds(s); return s; }
function renderTable(lines){
  const rows = lines.filter(l=>!/^\|[\s\-:|]+\|$/.test(l));
  if(!rows.length) return '';
  let html='<table>';
  rows.forEach((row,idx)=>{
    const cells = row.split('|').slice(1,-1).map(c=>c.trim());
    const tag = idx===0?'th':'td';
    html += '<tr>'+cells.map(c=>`<${tag}>${inlineMd(c)}</${tag}>`).join('')+'</tr>';
  });
  return html+'</table>';
}
function mdToHtml(md){
  if(!md) return '';
  const lines = md.split('\n'); let html='', i=0, para=[], items=[];
  function flushP(){ if(para.length){ html+='<p>'+inlineMd(para.join(' '))+'</p>'; para=[]; } }
  function flushL(){ if(items.length){ html+='<ul>'+items.map(li=>'<li>'+inlineMd(li)+'</li>').join('')+'</ul>'; items=[]; } }
  while(i<lines.length){
    const line=lines[i], t=line.trim();
    if(t===''){ flushP(); flushL(); i++; continue; }
    if(t.startsWith('```')){
      flushP(); flushL(); i++;
      const code=[];
      while(i<lines.length && !lines[i].trim().startsWith('```')){ code.push(lines[i]); i++; }
      i++;
      html += '<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>';
      continue;
    }
    if(t.startsWith('### ')){ flushP(); flushL(); html+='<h4>'+inlineMd(t.slice(4))+'</h4>'; i++; continue; }
    if(t.startsWith('## ')){ flushP(); flushL(); html+='<h3>'+inlineMd(t.slice(3))+'</h3>'; i++; continue; }
    if(t.startsWith('|')){ flushP(); flushL(); const tl=[]; while(i<lines.length && lines[i].trim().startsWith('|')){ tl.push(lines[i].trim()); i++; } html+=renderTable(tl); continue; }
    if(t.startsWith('- ')||t.startsWith('* ')){ flushP(); items.push(t.slice(2)); i++; continue; }
    if(/^\d+\.\s/.test(t)){ flushP(); items.push(t.replace(/^\d+\.\s/,'')); i++; continue; }
    para.push(t); i++;
  }
  flushP(); flushL(); return html;
}
function splitBody(body){
  const marker = 'Aplicação ao feedback:';
  const idx = (body||'').indexOf(marker);
  if(idx===-1) return {main:body, apply:null};
  let main = body.slice(0, idx).trim();
  let apply = body.slice(idx+marker.length).trim();
  return {main, apply};
}

/* ---------------- LAYOUT DE FORCA (calculado uma vez, apos o carregamento) ---------------- */
let POS = {};
function computeLayout(){
  const nodes = NOTES;
  const n = nodes.length;
  const idx = {}; nodes.forEach((nd,i)=>idx[nd.id]=i);
  const domList = DOM_ORDER.filter(d => nodes.some(nd=>nd.dom===d));
  const domAngle = {}; domList.forEach((d,i)=> domAngle[d] = (i/domList.length)*2*Math.PI);
  const W=1800, H=1300, R=520;
  const pos = nodes.map(nd=>{
    const a = domAngle[nd.dom] || 0;
    const cx = W/2 + Math.cos(a)*R, cy = H/2 + Math.sin(a)*R;
    return {x: cx + (Math.random()-0.5)*180, y: cy + (Math.random()-0.5)*180};
  });
  const vel = nodes.map(()=>({x:0,y:0}));
  const edgeIdx = EDGES.map(e=>({a:idx[e.from], b:idx[e.to]})).filter(e=>e.a!==undefined && e.b!==undefined);
  const iterations = 200, k = 46;
  for(let it=0; it<iterations; it++){
    for(let i=0;i<n;i++){
      let fx=0, fy=0;
      for(let j=0;j<n;j++){
        if(i===j) continue;
        let dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y;
        let d2=dx*dx+dy*dy || 0.01, d=Math.sqrt(d2);
        let force=(k*k)/d2*0.5;
        fx+=(dx/d)*force; fy+=(dy/d)*force;
      }
      vel[i].x=(vel[i].x+fx)*0.82; vel[i].y=(vel[i].y+fy)*0.82;
    }
    edgeIdx.forEach(e=>{
      let dx=pos[e.b].x-pos[e.a].x, dy=pos[e.b].y-pos[e.a].y;
      let d=Math.sqrt(dx*dx+dy*dy)||0.01;
      let force=(d-k)/k*2.0;
      let fx=(dx/d)*force, fy=(dy/d)*force;
      vel[e.a].x+=fx; vel[e.a].y+=fy; vel[e.b].x-=fx; vel[e.b].y-=fy;
    });
    for(let i=0;i<n;i++){
      vel[i].x += (W/2-pos[i].x)*0.0012;
      vel[i].y += (H/2-pos[i].y)*0.0012;
      pos[i].x += vel[i].x*0.035;
      pos[i].y += vel[i].y*0.035;
    }
  }
  nodes.forEach((nd,i)=> POS[nd.id]=pos[i]);
}

let DEGREE = {};

/* ---------------- GRAFO DE SKILLS (mapa de relacoes, mesma logica do grafo de notas) ---------------- */
let SKILL_EDGES = [], SKILL_DEGREE = {};
function reindexSkillGraph(){
  SKILL_EDGES = [];
  SKILLS.forEach(s => (s.skillsRel||[]).forEach(r => SKILL_EDGES.push({from:s.id, to:r.id, tipo:r.tipo})));
  SKILL_DEGREE = {};
  SKILLS.forEach(s=>SKILL_DEGREE[s.id]=0);
  SKILL_EDGES.forEach(e=>{ SKILL_DEGREE[e.from]=(SKILL_DEGREE[e.from]||0)+1; SKILL_DEGREE[e.to]=(SKILL_DEGREE[e.to]||0)+1; });
}

let POS_SKILL = {};
function computeSkillLayout(){
  const nodes = SKILLS;
  const n = nodes.length;
  const idx = {}; nodes.forEach((nd,i)=>idx[nd.id]=i);
  const domList = DOM_ORDER.filter(d => nodes.some(nd=>nd.dom===d));
  const domAngle = {}; domList.forEach((d,i)=> domAngle[d] = (i/domList.length)*2*Math.PI);
  const W=1400, H=1000, R=380;
  const pos = nodes.map(nd=>{
    const a = domAngle[nd.dom] || 0;
    const cx = W/2 + Math.cos(a)*R, cy = H/2 + Math.sin(a)*R;
    return {x: cx + (Math.random()-0.5)*160, y: cy + (Math.random()-0.5)*160};
  });
  const vel = nodes.map(()=>({x:0,y:0}));
  const edgeIdx = SKILL_EDGES.map(e=>({a:idx[e.from], b:idx[e.to]})).filter(e=>e.a!==undefined && e.b!==undefined);
  const iterations = 200, k = 60;
  for(let it=0; it<iterations; it++){
    for(let i=0;i<n;i++){
      let fx=0, fy=0;
      for(let j=0;j<n;j++){
        if(i===j) continue;
        let dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y;
        let d2=dx*dx+dy*dy || 0.01, d=Math.sqrt(d2);
        let force=(k*k)/d2*0.5;
        fx+=(dx/d)*force; fy+=(dy/d)*force;
      }
      vel[i].x=(vel[i].x+fx)*0.82; vel[i].y=(vel[i].y+fy)*0.82;
    }
    edgeIdx.forEach(e=>{
      let dx=pos[e.b].x-pos[e.a].x, dy=pos[e.b].y-pos[e.a].y;
      let d=Math.sqrt(dx*dx+dy*dy)||0.01;
      let force=(d-k)/k*2.0;
      let fx=(dx/d)*force, fy=(dy/d)*force;
      vel[e.a].x+=fx; vel[e.a].y+=fy; vel[e.b].x-=fx; vel[e.b].y-=fy;
    });
    for(let i=0;i<n;i++){
      vel[i].x += (W/2-pos[i].x)*0.0012;
      vel[i].y += (H/2-pos[i].y)*0.0012;
      pos[i].x += vel[i].x*0.035;
      pos[i].y += vel[i].y*0.035;
    }
  }
  nodes.forEach((nd,i)=> POS_SKILL[nd.id]=pos[i]);
}
function skillEdgeCls(tipo){
  if(tipo==='pre-requisito') return 'spre';
  if(tipo==='consumida-por') return 'scons';
  if(tipo==='complementar') return 'scomp';
  if(tipo==='despachada-para') return 'sdesp';
  return 'spre';
}
let skillZoom = {s:1, tx:0, ty:0};
function skillGraphSVG(){
  if(Object.keys(POS_SKILL).length===0) computeSkillLayout();
  const edges = SKILL_EDGES.map((e,i)=>{
    const a=POS_SKILL[e.from], b=POS_SKILL[e.to]; if(!a||!b) return '';
    return `<line class="edge ${skillEdgeCls(e.tipo)}" data-i="${i}" data-a="${e.from}" data-b="${e.to}"
      x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"></line>`;
  }).join('');
  const nodes = SKILLS.map(s=>{
    const p = POS_SKILL[s.id]; if(!p) return '';
    const deg = SKILL_DEGREE[s.id]||0;
    const r = Math.min(7 + deg*1.6, 18);
    const numshort = (s.numero||'').replace('skill-','').replace(/^0+/,'');
    return `<g class="gnode" data-id="${s.id}" tabindex="0" role="button"
        aria-label="${escapeHtml(s.titulo)}"
        onclick="go({v:'skill',id:'${s.id}'})"
        onkeydown="if(event.key==='Enter')go({v:'skill',id:'${s.id}'})">
      <title>${escapeHtml(s.titulo)}</title>
      <rect x="${(p.x-r).toFixed(1)}" y="${(p.y-r).toFixed(1)}" width="${(r*2).toFixed(1)}" height="${(r*2).toFixed(1)}" rx="4" fill="${domColor(s.dom)}"></rect>
      ${r>=10?`<text class="tag" x="${p.x.toFixed(1)}" y="${(p.y+2.8).toFixed(1)}">${numshort}</text>`:''}
    </g>`;
  }).join('');
  return `<svg class="graph" id="skillGraphSvg" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid meet">
    <g id="skillViewport" transform="translate(${skillZoom.tx},${skillZoom.ty}) scale(${skillZoom.s})">
    <g>${edges}</g><g>${nodes}</g></g></svg>`;
}
function skillZoomBy(f){ skillZoom.s = Math.max(0.35, Math.min(4, skillZoom.s*f)); applySkillZoom(); }
function skillZoomReset(){ skillZoom={s:1,tx:0,ty:0}; applySkillZoom(); }
function applySkillZoom(){
  const vp = document.getElementById('skillViewport');
  if(vp) vp.setAttribute('transform', `translate(${skillZoom.tx},${skillZoom.ty}) scale(${skillZoom.s})`);
}
function wireSkillGraph(){
  const svg=view.querySelector('svg#skillGraphSvg');
  if(!svg) return;
  const nodes=[...svg.querySelectorAll('.gnode')];
  const edges=[...svg.querySelectorAll('.edge')];
  nodes.forEach(g=>{
    g.addEventListener('mouseenter',()=>hot(g.dataset.id,true));
    g.addEventListener('mouseleave',()=>hot(null,false));
    g.addEventListener('focus',()=>hot(g.dataset.id,true));
    g.addEventListener('blur',()=>hot(null,false));
  });
  function hot(id,on){
    if(!on||!id){ svg.classList.remove('dim'); edges.forEach(e=>e.classList.remove('hot')); nodes.forEach(n=>n.classList.remove('hot','nb')); return; }
    svg.classList.add('dim');
    const nb=new Set([id]);
    edges.forEach(e=>{
      if(e.dataset.a===id||e.dataset.b===id){ e.classList.add('hot'); nb.add(e.dataset.a); nb.add(e.dataset.b); }
      else e.classList.remove('hot');
    });
    nodes.forEach(n=>n.classList.toggle('hot', nb.has(n.dataset.id)));
  }
  let dragging=false, sx=0, sy=0, ostx=0, osty=0;
  svg.addEventListener('mousedown', e=>{ dragging=true; svg.classList.add('panning'); sx=e.clientX; sy=e.clientY; ostx=skillZoom.tx; osty=skillZoom.ty; });
  window.addEventListener('mouseup', ()=>{ dragging=false; svg.classList.remove('panning'); });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    skillZoom.tx = ostx + (e.clientX-sx)/skillZoom.s;
    skillZoom.ty = osty + (e.clientY-sy)/skillZoom.s;
    applySkillZoom();
  });
  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    skillZoomBy(e.deltaY<0?1.1:0.9);
  }, {passive:false});
}

          <button class="gbtn" onclick="zoomBy(0.8)">−</button>
          <button class="gbtn" onclick="zoomReset()">⤾</button>
        </div>
      </div>
    </div>`;
  wireGraph();
}
function edgeCls(tipo){
  if(tipo==='causal') return 'cau';
  if(tipo==='complementa') return 'com';
  if(tipo==='contradiz') return 'con';
  if(tipo==='alternativa-a') return 'alt';
  return 'pre';
}
function graphSVG(){
  if(Object.keys(POS).length===0) computeLayout();
  const edges = EDGES.map((e,i)=>{
    const a=POS[e.from], b=POS[e.to]; if(!a||!b) return '';
    return `<line class="edge ${edgeCls(e.tipo)}" data-i="${i}" data-a="${e.from}" data-b="${e.to}"
      x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"></line>`;
  }).join('');
  const nodes = NOTES.map(n=>{
    const p = POS[n.id]; if(!p) return '';
    const deg = DEGREE[n.id]||0;
    const r = Math.min(6 + deg*0.9, 16);
    const idnum = n.id.replace('nota-','').replace(/^0+/,'');
    return `<g class="gnode" data-id="${n.id}" tabindex="0" role="button"
        aria-label="${escapeHtml(n.titulo)}"
        onclick="go({v:'note',id:'${n.id}'})"
        onkeydown="if(event.key==='Enter')go({v:'note',id:'${n.id}'})">
      <title>${escapeHtml(n.titulo)}</title>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${domColor(n.dom)}"></circle>
      ${r>=9?`<text class="tag" x="${p.x.toFixed(1)}" y="${(p.y+2.8).toFixed(1)}">${idnum}</text>`:''}
    </g>`;
  }).join('');
  return `<svg class="graph" id="graphSvg" viewBox="0 0 1800 1300" preserveAspectRatio="xMidYMid meet">
    <g id="viewport" transform="translate(${zoom.tx},${zoom.ty}) scale(${zoom.s})">
    <g>${edges}</g><g>${nodes}</g></g></svg>`;
}
function zoomBy(f){
  zoom.s = Math.max(0.35, Math.min(4, zoom.s*f));
  applyZoom();
}
function zoomReset(){ zoom={s:1,tx:0,ty:0}; applyZoom(); }
function applyZoom(){
  const vp = document.getElementById('viewport');
  if(vp) vp.setAttribute('transform', `translate(${zoom.tx},${zoom.ty}) scale(${zoom.s})`);
}
function wireGraph(){
  const svg=view.querySelector('svg.graph');
  if(!svg) return;
  const nodes=[...svg.querySelectorAll('.gnode')];
  const edges=[...svg.querySelectorAll('.edge')];
  nodes.forEach(g=>{
    g.addEventListener('mouseenter',()=>hot(g.dataset.id,true));
    g.addEventListener('mouseleave',()=>hot(null,false));
    g.addEventListener('focus',()=>hot(g.dataset.id,true));
    g.addEventListener('blur',()=>hot(null,false));
  });
  function hot(id,on){
    if(!on||!id){ svg.classList.remove('dim'); edges.forEach(e=>e.classList.remove('hot')); nodes.forEach(n=>n.classList.remove('hot','nb')); return; }
    svg.classList.add('dim');
    const nb=new Set([id]);
    edges.forEach(e=>{
      if(e.dataset.a===id||e.dataset.b===id){ e.classList.add('hot'); nb.add(e.dataset.a); nb.add(e.dataset.b); }
      else e.classList.remove('hot');
    });
    nodes.forEach(n=>n.classList.toggle('hot', nb.has(n.dataset.id)));
  }
  /* pan + zoom */
  let dragging=false, sx=0, sy=0, ostx=0, osty=0;
  svg.addEventListener('mousedown', e=>{ dragging=true; svg.classList.add('panning'); sx=e.clientX; sy=e.clientY; ostx=zoom.tx; osty=zoom.ty; });
  window.addEventListener('mouseup', ()=>{ dragging=false; svg.classList.remove('panning'); });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    zoom.tx = ostx + (e.clientX-sx)/zoom.s;
    zoom.ty = osty + (e.clientY-sy)/zoom.s;
    applyZoom();
  });
  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    zoomBy(e.deltaY<0?1.1:0.9);
  }, {passive:false});
}

function extrairNumero(regex, texto){
  if(!texto) return null;
  const m = texto.match(regex);
  if(!m) return null;
  const n = parseFloat(m[1].replace(',','.'));
  return isNaN(n) ? null : n;
}
function resumoTssIf(a){
  const motivo = a.skills_output && a.skills_output['skill-0002'] ? a.skills_output['skill-0002'].motivo : null;
  const tss = extrairNumero(/TSS[^=]*=\s*([\d.,]+)/i, motivo);
  const iff = extrairNumero(/IF[^=]*=\s*([\d.,]+)/i, motivo);
  return {tss, iff};
}

<script>

   NOVO: autenticação (Supabase Auth), envio de fonte (upload), fila de

   mesmos componentes visuais (.panel, .revcard, .chip, .btn) do restante

function renderAuthbox(){
  const box = document.getElementById('authbox');
  if(session){
    box.innerHTML = `
      <div class="authstatus"><span class="authdot on"></span>Conectado: ${escapeHtml(session.user.email)}</div>
      <button class="authbtn" onclick="fazerLogout()">Sair</button>`;
  } else {
    box.innerHTML = `
      <div class="authstatus"><span class="authdot"></span>Não conectado</div>
      <button class="authbtn" onclick="go({v:'fila'})">Entrar</button>`;
  }
}

function lockedView(titulo){
  return `
    <div class="h-eyebrow">Área restrita</div>
    <h1>${escapeHtml(titulo)}</h1>
    <div class="lockmsg">Fila de processamento e decisões de revisão exigem login (só o Jacques tem conta neste projeto Supabase). As demais áreas — mapa, skills, notas, revisão legada — continuam públicas.</div>
    <div style="margin-top:18px">${renderLoginForm()}</div>`;
}

function renderLoginForm(){
  return `
    <div class="panel loginform" style="max-width:360px">
      <h3>Entrar</h3>
      <input type="email" id="login-email" placeholder="email" value="${ALLOWED_EMAIL}" autocomplete="username">
      <input type="password" id="login-pass" placeholder="senha" autocomplete="current-password">
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="fazerLogin()">Entrar</button>
        <button class="btn ghost" onclick="fazerCadastro()">Criar conta (1ª vez)</button>
      </div>
      <div class="formmsg" id="login-msg"></div>
    </div>`;
}

async function fazerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const msg = document.getElementById('login-msg');
  msg.textContent = 'Entrando...'; msg.className='formmsg';
  const {data, error} = await sb.auth.signInWithPassword({email, password: pass});
  if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
  session = data.session;
  msg.textContent = 'Login ok.'; msg.className='formmsg ok';
  await carregarFilaERevisao();
  await carregarPerfil();
  renderAuthbox();
  render();
}
async function fazerCadastro(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const msg = document.getElementById('login-msg');
  if(email !== ALLOWED_EMAIL){ msg.textContent = 'Cadastro restrito a '+ALLOWED_EMAIL; msg.className='formmsg err'; return; }
  msg.textContent = 'Criando conta...'; msg.className='formmsg';
  const {data, error} = await sb.auth.signUp({email, password: pass});
  if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
  msg.textContent = data.session ? 'Conta criada e conectada.' : 'Conta criada — confirme o e-mail e depois entre.';
  msg.className='formmsg ok';
  if(data.session){ session = data.session; await carregarFilaERevisao(); await carregarPerfil(); renderAuthbox(); render(); }
}
async function fazerLogout(){
  await sb.auth.signOut();
  session = null; FILA = []; REVISAO_PIPE = []; meuPerfil = null;
  renderAuthbox();
  go({v:'home'});
}

function renderFila(){
  if(!session){ view.innerHTML = lockedView('Fila de processamento'); return; }
  const statusLabel = {pendente:'pendente', processando:'processando', aguardando_revisao:'aguardando revisão', concluido:'concluído', erro:'erro'};
  const rows = FILA.map(j => `
    <div class="jobrow">
      <div>
        <div class="jobname">${escapeHtml(j.arquivo_nome)}</div>
        <div class="jobmeta">${new Date(j.criado_em).toLocaleString('pt-BR')}${j.etapa_atual?' · '+escapeHtml(j.etapa_atual):''}</div>
      </div>
      <span class="jobstatus ${j.status}">${statusLabel[j.status]||j.status}</span>
    </div>`).join('');
  view.innerHTML = `
    <div class="h-eyebrow">Ingestão</div>
    <h1>Fila de processamento</h1>
    <p class="lede">Status de cada fonte processada via chat com o Claude, do início da extração até a nota/skill ficar pronta para revisão em "Revisão pendente".</p>
    <div class="jobtable">${rows || '<div class="empty">Nenhum job ainda. Envie um material novo numa conversa com o Claude para começar.</div>'}</div>`;
}

/* ---------------- Cadastro de assessoria/atleta ---------------- */
const SELECT_STYLE = 'border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:9px 11px;font-family:var(--sans);font-size:13.5px;color:var(--ink)';

        <input type="text" id="${prefix}codigo" placeholder="código de convite" style="flex:1">
        <button class="btn ghost" type="button" onclick="buscarCodigoConvite('${prefix}')">Buscar</button>
      </div>
      <div id="${prefix}codigo-resultado" class="formmsg"></div>

        <option value="">— nenhuma (fico independente) —</option>
      </select>

function renderCadastro(){
  vinculoEscolhido = {};

    view.innerHTML = `
      <div class="h-eyebrow">Conta</div>
      <h1>Cadastro / conta</h1>
      <p class="lede">Crie a conta da sua assessoria (treinador) ou a sua conta de atleta, ou entre se já tiver uma.</p>
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:18px">
        <div class="panel loginform" style="max-width:340px">
          <h3>Já tenho conta</h3>
          <input type="email" id="cad-login-email" placeholder="email" autocomplete="username">
          <input type="password" id="cad-login-pass" placeholder="senha" autocomplete="current-password">

          <div class="formmsg" id="cad-login-msg"></div>
        </div>
        <div class="panel loginform" style="max-width:380px">
          <h3>Criar conta</h3>
          <input type="text" id="cad-nome" placeholder="nome">
          <input type="email" id="cad-email" placeholder="email" autocomplete="username">
          <input type="password" id="cad-pass" placeholder="senha (mín. 6 caracteres)" autocomplete="new-password">
          <div style="display:flex;gap:14px;font-size:13.5px">
            <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="cad-tipo" value="assessoria" checked onchange="atualizarTipoCadastro()">Sou treinador (assessoria)</label>
            <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="cad-tipo" value="atleta" onchange="atualizarTipoCadastro()">Sou atleta</label>
          </div>
          <div id="cad-vinculo-box">${vinculoBoxHtml('cad-')}</div>
          <button class="btn" onclick="criarConta()">Criar conta</button>
          <div class="formmsg" id="cad-msg"></div>
        </div>
      </div>`;
    return;
  }
  if(!meuPerfil){
    view.innerHTML = `
      <div class="h-eyebrow">Conta</div>
      <h1>Complete seu cadastro</h1>
      <p class="lede">Conectado como <b>${escapeHtml(session.user.email)}</b>, mas ainda sem assessoria ou atleta vinculado a esta conta.</p>
      <div class="panel loginform" style="max-width:380px;margin-top:14px">
        <input type="text" id="cad2-nome" placeholder="nome">
        <div style="display:flex;gap:14px;font-size:13.5px">
          <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="cad2-tipo" value="assessoria" checked onchange="atualizarTipoCadastro2()">Sou treinador (assessoria)</label>
          <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="cad2-tipo" value="atleta" onchange="atualizarTipoCadastro2()">Sou atleta</label>
        </div>
        <div id="cad2-vinculo-box">${vinculoBoxHtml('cad2-')}</div>
        <button class="btn" onclick="completarCadastro()">Salvar</button>
        <div class="formmsg" id="cad2-msg"></div>
      </div>`;
    return;
  }
  if(meuPerfil.tipo==='assessoria') return renderPerfilAssessoria();
  return renderPerfilAtleta();

function atualizarTipoCadastro(){
  const tipo = document.querySelector('input[name="cad-tipo"]:checked').value;
  const box = document.getElementById('cad-vinculo-inner');
  box.style.display = tipo==='atleta' ? 'flex' : 'none';
  if(tipo==='atleta') popularSelectAssessorias('cad-select-assessoria');
}
function atualizarTipoCadastro2(){
  const tipo = document.querySelector('input[name="cad2-tipo"]:checked').value;
  const box = document.getElementById('cad2-vinculo-inner');
  box.style.display = tipo==='atleta' ? 'flex' : 'none';
  if(tipo==='atleta') popularSelectAssessorias('cad2-select-assessoria');
}

async function listarAssessoriasPublicas(){
  const {data, error} = await sb.from('assessorias_publicas').select('*').order('nome');
  if(error) return [];
  return data || [];
}
async function popularSelectAssessorias(selectId){
  const sel = document.getElementById(selectId);
  if(!sel) return;
  const list = await listarAssessoriasPublicas();
  sel.innerHTML = '<option value="">— nenhuma (fico independente) —</option>' +
    list.map(a => `<option value="${a.id}">${escapeHtml(a.nome)}</option>`).join('');
}
async function buscarCodigoConvite(prefix){
  const codigo = document.getElementById(prefix+'codigo').value.trim();
  const out = document.getElementById(prefix+'codigo-resultado');
  if(!codigo){ out.textContent=''; return; }
  const {data, error} = await sb.rpc('buscar_assessoria_por_codigo', {p_codigo: codigo});
  if(error || !data || !data.length){
    out.textContent = 'Código não encontrado.'; out.className='formmsg err';
    delete vinculoEscolhido[prefix];
    return;
  }
  const a = data[0];
  out.textContent = 'Encontrada: '+a.nome+' (selecionada)'; out.className='formmsg ok';
  vinculoEscolhido[prefix] = a.id;
  const sel = document.getElementById(prefix+'select-assessoria');
  if(sel) sel.value = ''; // código tem prioridade sobre a lista
}
function resolverVinculoEscolhido(prefix){
  if(vinculoEscolhido[prefix]) return vinculoEscolhido[prefix];
  const sel = document.getElementById(prefix+'select-assessoria');
  return (sel && sel.value) ? sel.value : null;
}

async function fazerLoginCadastro(){
  const email = document.getElementById('cad-login-email').value.trim();
  const pass = document.getElementById('cad-login-pass').value;
  const msg = document.getElementById('cad-login-msg');
  msg.textContent = 'Entrando...'; msg.className='formmsg';
  const {data, error} = await sb.auth.signInWithPassword({email, password: pass});
  if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
  session = data.session;
  await carregarFilaERevisao();
  await carregarPerfil();
  renderAuthbox();
  render();
}

async function criarConta(){
  const nome = document.getElementById('cad-nome').value.trim();
  const email = document.getElementById('cad-email').value.trim();
  const pass = document.getElementById('cad-pass').value;
  const tipo = document.querySelector('input[name="cad-tipo"]:checked').value;
  const msg = document.getElementById('cad-msg');
  if(!nome || !email || !pass){ msg.textContent = 'Preencha nome, e-mail e senha.'; msg.className='formmsg err'; return; }
  msg.textContent = 'Criando conta...'; msg.className='formmsg';
  const {data, error} = await sb.auth.signUp({email, password: pass});
  if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
  if(!data.session){
    msg.textContent = 'Conta criada — confirme o e-mail e depois entre para concluir o cadastro.';
    msg.className = 'formmsg ok';
    return;
  }
  session = data.session;
  await carregarFilaERevisao();
  await finalizarCadastroPerfil(tipo, nome, 'cad-', msg);
}
async function completarCadastro(){
  const nome = document.getElementById('cad2-nome').value.trim();
  const tipo = document.querySelector('input[name="cad2-tipo"]:checked').value;
  const msg = document.getElementById('cad2-msg');
  if(!nome){ msg.textContent = 'Preencha o nome.'; msg.className='formmsg err'; return; }
  await finalizarCadastroPerfil(tipo, nome, 'cad2-', msg);
}
async function finalizarCadastroPerfil(tipo, nome, prefix, msg){
  msg.textContent = 'Salvando...'; msg.className='formmsg';
  if(tipo==='assessoria'){
    const {data, error} = await sb.from('assessorias').insert({nome, owner_user_id: session.user.id}).select().single();
    if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
    meuPerfil = {tipo:'assessoria', row:data};
    msg.textContent = 'Cadastro concluído.'; msg.className='formmsg ok';
  } else {
    // tenta reivindicar um cadastro pré-criado pelo coach com o mesmo e-mail antes de criar um novo
    const {data: reiv} = await sb.rpc('reivindicar_atleta_por_email');
    if(reiv){
      meuPerfil = {tipo:'atleta', row: reiv};
      msg.textContent = 'Sua assessoria já tinha te cadastrado — conta vinculada automaticamente.'; msg.className='formmsg ok';
    } else {
      const assessoriaId = resolverVinculoEscolhido(prefix);
      const {data, error} = await sb.from('atletas').insert({nome, email: session.user.email, user_id: session.user.id, assessoria_id: assessoriaId}).select().single();
      if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
      meuPerfil = {tipo:'atleta', row:data};
      msg.textContent = 'Cadastro concluído.'; msg.className='formmsg ok';
    }
  }
  renderAuthbox();
  render();
}

async function renderPerfilAssessoria(){
  const row = meuPerfil.row;
  view.innerHTML = `
    <div class="h-eyebrow">Conta</div>
    <h1>${escapeHtml(row.nome)}</h1>
    <p class="lede">Sua assessoria. Código de convite para atletas se vincularem: <code>${escapeHtml(row.codigo_convite)}</code></p>
    <div class="panel loginform" style="max-width:380px">
      <h3>Editar nome</h3>
      <input type="text" id="assessoria-nome" value="${escapeHtml(row.nome)}">
      <button class="btn" onclick="salvarPerfilAssessoria()">Salvar</button>
      <div class="formmsg" id="assessoria-msg"></div>
    </div>
    <div class="panel loginform" style="max-width:420px;margin-top:18px">
      <h3>Adicionar atleta</h3>
      <input type="text" id="novo-atleta-nome" placeholder="nome do atleta">
      <input type="email" id="novo-atleta-email" placeholder="e-mail do atleta">
      <button class="btn" onclick="adicionarAtletaNaAssessoria()">Adicionar</button>
      <div class="formmsg" id="novo-atleta-msg"></div>
    </div>
    <div class="lbl" style="margin-top:20px">Atletas vinculados</div>
    <div class="jobtable" id="lista-atletas"><div class="hint">Carregando atletas…</div></div>`;
  await carregarECarregarListaAtletas();
}
async function carregarECarregarListaAtletas(){
  const box = document.getElementById('lista-atletas');
  if(!box) return;
  const {data, error} = await sb.from('atletas').select('*').eq('assessoria_id', meuPerfil.row.id).order('nome');
  if(error){ box.innerHTML = `<div class="empty">Erro ao carregar atletas: ${escapeHtml(error.message)}</div>`; return; }
  if(!data || !data.length){ box.innerHTML = '<div class="empty">Nenhum atleta vinculado ainda.</div>'; return; }
  box.innerHTML = data.map(a => `
    <div class="jobrow">
      <div>
        <div class="jobname">${escapeHtml(a.nome)}</div>
        <div class="jobmeta">${escapeHtml(a.email||'sem e-mail')}</div>
      </div>
      <span class="jobstatus ${a.user_id?'concluido':'pendente'}">${a.user_id?'conta vinculada':'aguardando cadastro'}</span>
      <button class="btn ghost" style="margin-left:10px" onclick="removerAtletaDaAssessoria('${a.id}')">Remover</button>
    </div>`).join('');
}
async function salvarPerfilAssessoria(){
  const nome = document.getElementById('assessoria-nome').value.trim();
  const msg = document.getElementById('assessoria-msg');
  if(!nome){ msg.textContent = 'Nome não pode ficar vazio.'; msg.className='formmsg err'; return; }
  const {data, error} = await sb.from('assessorias').update({nome, atualizado_em:new Date().toISOString()}).eq('id', meuPerfil.row.id).select().single();
  if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
  meuPerfil.row = data;
  msg.textContent = 'Salvo.'; msg.className='formmsg ok';
  const h1 = view.querySelector('h1'); if(h1) h1.textContent = data.nome;
}
async function adicionarAtletaNaAssessoria(){
  const nome = document.getElementById('novo-atleta-nome').value.trim();
  const email = document.getElementById('novo-atleta-email').value.trim();
  const msg = document.getElementById('novo-atleta-msg');
  if(!nome){ msg.textContent = 'Preencha o nome do atleta.'; msg.className='formmsg err'; return; }
  msg.textContent = 'Adicionando...'; msg.className='formmsg';
  const {error} = await sb.from('atletas').insert({nome, email: email||null, assessoria_id: meuPerfil.row.id});
  if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
  msg.textContent = 'Atleta adicionado. Ele(a) pode vincular a própria conta depois com o mesmo e-mail, ou usando o código de convite.'; msg.className='formmsg ok';
  document.getElementById('novo-atleta-nome').value = ''; document.getElementById('novo-atleta-email').value = '';
  await carregarECarregarListaAtletas();
}
async function removerAtletaDaAssessoria(id){
  if(!confirm('Remover este atleta da assessoria?')) return;
  const {error} = await sb.from('atletas').delete().eq('id', id);
  if(error){ alert('Erro: '+error.message); return; }
  await carregarECarregarListaAtletas();
}

function dashSetMode(mode){
  const el = document.getElementById('atletaDash');
  if(!el) return;
  el.classList.toggle('mobile-mode', mode==='mobile');
  document.getElementById('dashBtnDesktop').classList.toggle('active', mode==='desktop');
  document.getElementById('dashBtnMobile').classList.toggle('active', mode==='mobile');
  window.dispatchEvent(new Event('resize'));
}
function dashShowTab(name){
  ['diario','semanal','mensal'].forEach(function(n){
    document.getElementById('tab-'+n).classList.toggle('active', n===name);
    document.getElementById('tabbtn-'+n).classList.toggle('active', n===name);
  });
  window.dispatchEvent(new Event('resize'));
}
function dashShowDia(id, btn){
  document.querySelectorAll('#atletaDash .diacontent').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('#atletaDash .diapill').forEach(function(el){ el.classList.remove('active'); });
  btn.classList.add('active');
}
function dashToggle(id, btn){
  const el = document.getElementById(id);
  const opening = !el.classList.contains('open');
  el.classList.toggle('open');
  btn.classList.toggle('open');
  btn.querySelector('span').textContent = opening ? 'Ocultar gráfico' : 'Ver gráfico';
  if(opening && !el.dataset.rendered){
    el.dataset.rendered = '1';
    dashRenderChart(id);
  }
}
function dashBaseOpts(extra){
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false} },
    scales:{ x:{ grid:{display:false}, ticks:{color:'#898781', font:{size:11}} }, y:{ display:false } }
  }, extra||{});
}
function dashRenderChart(id){
  if(id==='det-decoupling'){
    new Chart(document.getElementById('chartDecoupling'), {
      type:'bar',
      data:{ labels:['Terça','Quarta','Quinta'], datasets:[{ data:[-0.6,4.2,-0.3], backgroundColor:['#7bc25a','#7bc25a','#7bc25a'], borderRadius:4 }] },
      options: dashBaseOpts({ scales:{ x:{ grid:{display:false} }, y:{ display:true, ticks:{callback:v=>v+'%'} } } })
    });
  }
  if(id==='det-carga'){
    new Chart(document.getElementById('chartCarga'), {
      type:'bar',
      data:{ labels:['Terça','Quarta','Quinta'], datasets:[{ data:[96,103,85], backgroundColor:['#fab219','#fab219','#7bc25a'], borderRadius:4 }] },
      options: dashBaseOpts()
    });
  }
  if(id==='det-volume'){
    new Chart(document.getElementById('chartVolume'), {
      type:'bar',
      data:{ labels:['26/07 a 01/08','02/08 a 08/08'], datasets:[{ data:[309,127], backgroundColor:['#c3c2b7','#fab219'], borderRadius:4 }] },
      options: dashBaseOpts()
    });
  }
  if(id==='det-matches'){
    new Chart(document.getElementById('chartMatches'), {
      type:'bar',
      data:{ labels:['Terça','Quarta','Quinta'], datasets:[{ data:[4,6,1], backgroundColor:['#fab219','#d03b3b','#7bc25a'], borderRadius:4 }] },
      options: dashBaseOpts()
    });
  }
  if(id==='det-vi'){
    new Chart(document.getElementById('chartVI'), {
      type:'bar',
      data:{
        labels:['Terça','Quarta','Quinta'],
        datasets:[
          { label:'Quão picotada (índice)', data:[1.48,1.60,1.14], backgroundColor:'#85B7EB', borderRadius:4 },
          { label:'Nº de arrancadas', data:[4,6,1], backgroundColor:'#0F6E56', borderRadius:4 }
        ]
      },
      options: dashBaseOpts({ plugins:{ legend:{ display:true, position:'top', labels:{ boxWidth:10, font:{size:11}, color:'#5f5e5a' } } } })
    });
  }
}

async function renderPerfilAtleta(){
  const row = meuPerfil.row;
  let assessoriaNome = null;
  if(row.assessoria_id){
    const {data} = await sb.from('assessorias_publicas').select('*').eq('id', row.assessoria_id).maybeSingle();
    assessoriaNome = data ? data.nome : null;
  }
  view.innerHTML = `
    <div class="h-eyebrow">Conta</div>
    <h1>${escapeHtml(row.nome)}</h1>
    <p class="lede">${row.assessoria_id ? 'Vinculado à assessoria <b>'+escapeHtml(assessoriaNome||'—')+'</b>.' : 'Atleta independente — sem assessoria vinculada.'}</p>

    ${atletaDashboardHtml(row.nome)}

    <div class="cols" style="margin-top:26px;max-width:820px">
      <div class="panel loginform">
        <h3>Meus dados</h3>
        <input type="text" id="atleta-nome" value="${escapeHtml(row.nome)}" placeholder="nome">
        <input type="number" id="atleta-peso" value="${row.peso_kg??''}" placeholder="peso (kg)" step="0.1">
        <input type="number" id="atleta-ftp" value="${row.ftp_vigente_w??''}" placeholder="FTP vigente (W)" step="1">
        <button class="btn" onclick="salvarPerfilAtleta()">Salvar</button>
        <div class="formmsg" id="atleta-msg"></div>
      </div>
      ${row.assessoria_id ? '' : `
      <div class="panel loginform">
        <h3>Vincular a uma assessoria</h3>
        <div style="display:flex;gap:8px">
          <input type="text" id="atv-codigo" placeholder="código de convite" style="flex:1">
          <button class="btn ghost" type="button" onclick="buscarCodigoConvite('atv-')">Buscar</button>
        </div>
        <div id="atv-codigo-resultado" class="formmsg"></div>
        <div class="lbl">ou escolha da lista</div>
        <select id="atv-select-assessoria" style="${SELECT_STYLE}"><option value="">— selecione —</option></select>
        <button class="btn" onclick="vincularAssessoriaAgora()">Vincular</button>
        <div class="formmsg" id="atv-msg"></div>
      </div>`}
    </div>`;
  if(!row.assessoria_id) await popularSelectAssessorias('atv-select-assessoria');
}
async function salvarPerfilAtleta(){
  const nome = document.getElementById('atleta-nome').value.trim();
  const pesoRaw = document.getElementById('atleta-peso').value;
  const ftpRaw = document.getElementById('atleta-ftp').value;
  const msg = document.getElementById('atleta-msg');
  if(!nome){ msg.textContent = 'Nome não pode ficar vazio.'; msg.className='formmsg err'; return; }
  const patch = {
    nome, atualizado_em: new Date().toISOString(),
    peso_kg: pesoRaw==='' ? null : parseFloat(pesoRaw),
    ftp_vigente_w: ftpRaw==='' ? null : parseFloat(ftpRaw),
  };
  const {data, error} = await sb.from('atletas').update(patch).eq('id', meuPerfil.row.id).select().single();
  if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
  meuPerfil.row = data;
  msg.textContent = 'Salvo.'; msg.className='formmsg ok';
  const h1 = view.querySelector('h1'); if(h1) h1.textContent = data.nome;
}
async function vincularAssessoriaAgora(){
  const id = resolverVinculoEscolhido('atv-');
  const msg = document.getElementById('atv-msg');
  if(!id){ msg.textContent = 'Busque por código ou escolha uma assessoria na lista.'; msg.className='formmsg err'; return; }
  const {data, error} = await sb.from('atletas').update({assessoria_id:id, atualizado_em:new Date().toISOString()}).eq('id', meuPerfil.row.id).select().single();
  if(error){ msg.textContent = error.message; msg.className='formmsg err'; return; }
  meuPerfil.row = data;
  msg.textContent = 'Vinculado!'; msg.className='formmsg ok';
  render();
}

function renderFilaRevisaoPipeline(){
  if(!session){
    return `<div class="revsection"><div class="revhead"><span class="revdot conflito"></span>Fila de revisão (ingestão nova)</div>
      <p class="hint">Entre para ver e decidir sobre candidatos a nota/skill gerados a partir de fontes enviadas.</p></div>`;
  }
  const pendentes = REVISAO_PIPE.filter(r=>r.status==='pendente');
  if(!REVISAO_PIPE.length){
    return `<div class="revsection"><div class="revhead"><span class="revdot conflito"></span>Fila de revisão (ingestão nova)<span class="revcount">0</span></div>
      <p class="hint">Nenhum candidato gerado ainda pelo pipeline de ingestão — isso é normal até a tarefa de processamento automático (#210) estar ativa.</p></div>`;
  }
  const cards = REVISAO_PIPE.map(r => {
    const comentarios = (r.comentarios_revisao||[]).map(c=>`<div class="commentitem"><span class="ca">${escapeHtml(c.autor)} · ${new Date(c.criado_em).toLocaleString('pt-BR')}</span>${escapeHtml(c.comentario)}</div>`).join('');
    const decidido = r.status !== 'pendente';
    return `<div class="revcard">
      <div class="revtop">
        <span class="chip line">${escapeHtml(r.categoria_revisao)}</span>
        <span class="chip line">${r.status}</span>
      </div>
      <div class="revtitle">${escapeHtml(r.tipo_item)} ${r.entidade_relacionada_id?'· '+escapeHtml(r.entidade_relacionada_id):''}</div>
      <div class="revbody"><pre style="white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--paper);padding:10px;border-radius:8px">${escapeHtml(JSON.stringify(r.conteudo_proposto, null, 2))}</pre>
      <p>${escapeHtml(r.justificativa||'')}</p></div>
      <div class="commentlist">${comentarios}</div>
      ${decidido ? '' : `
      <div class="decisionrow">
        <button class="btn" onclick="decidirRevisao('${r.id}','aprovado')">Aprovar</button>
        <button class="btn ghost" onclick="decidirRevisao('${r.id}','reprovado')">Reprovar</button>
        <button class="btn ghost" onclick="comentarRevisao('${r.id}')">Comentar</button>
      </div>`}
    </div>`;
  }).join('');
  return `<div class="revsection"><div class="revhead"><span class="revdot conflito"></span>Fila de revisão (ingestão nova)<span class="revcount">${pendentes.length}</span></div>
    <p class="hint">Candidatos a nota/skill gerados a partir de fontes enviadas, aguardando aprovação antes de entrar no cânone.</p>
    <div class="revlist">${cards}</div></div>`;
}
function wireRevisaoPipeline(){ /* delegação via onclick inline — nada a religar aqui */ }
async function decidirRevisao(id, status){
  const { error } = await sb.from('revisao_pendente').update({status, decidido_por: session.user.email, decidido_em: new Date().toISOString()}).eq('id', id);
  if(error){ alert('Erro: '+error.message); return; }
  await carregarFilaERevisao();
  render();
}
async function comentarRevisao(id){
  const texto = prompt('Comentário:');
  if(!texto) return;
  const { error } = await sb.from('comentarios_revisao').insert({revisao_id: id, autor: session.user.email, comentario: texto});
  if(error){ alert('Erro: '+error.message); return; }
  await carregarFilaERevisao();
  render();
}

/* ---------------- boot ---------------- */
async function boot(){
  const { data: { session: s } } = await sb.auth.getSession();
  session = s;
  await carregarDados();
  reindexSkills();
  reindexNotes();
  reindexDegree();
  reindexSkillGraph();
  reindexLinkify();
  await carregarFilaERevisao();
  await carregarPerfil();
  renderAuthbox();
  sidebar();
  render();
  history.replaceState(state, '', location.pathname + location.search);

  sb.auth.onAuthStateChange(async (_event, newSession) => {
    session = newSession;
    await carregarFilaERevisao();
    await carregarPerfil();
    renderAuthbox();
    if(state.v==='upload' || state.v==='fila' || state.v==='revisao' || state.v==='cadastro') render();
  });
}
boot();
